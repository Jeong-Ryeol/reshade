name: build

on:
  push:
    branches:
      - main
      - sherbet-base
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      owner:
        description: '구매자 닉네임 (파일 곳곳 각인)'
        required: false
        default: ''
      order_no:
        description: '주문번호'
        required: false
        default: ''
      default_theme:
        description: '기본 테마 (mint/peach/pink/rainbow/lavender/noir)'
        required: false
        default: 'mint'
      nodelock:
        description: '노드락(첫 실행 PC 고정) 켜기'
        type: boolean
        required: false
        default: false
      preset_ini:
        description: '개인 전용 프리셋 .ini (base64 인코딩 권장 — 웹 UI 붙여넣기는 줄바꿈이 사라짐. 비우면 프리셋 미포함)'
        required: false
        default: ''

permissions: {}

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Apply Sherbet owner
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          SHERBET_INPUT_OWNER: ${{ github.event.inputs.owner }}
          SHERBET_INPUT_ORDER_NO: ${{ github.event.inputs.order_no }}
          SHERBET_INPUT_DEFAULT_THEME: ${{ github.event.inputs.default_theme }}
          SHERBET_INPUT_NODELOCK: ${{ github.event.inputs.nodelock }}
          SHERBET_INPUT_PRESET_INI: ${{ github.event.inputs.preset_ini }}
        run: |
          $owner = $env:SHERBET_INPUT_OWNER -replace '\\', '\\\\' -replace '"', '\"'
          $order = $env:SHERBET_INPUT_ORDER_NO -replace '\\', '\\\\' -replace '"', '\"'
          $theme = $env:SHERBET_INPUT_DEFAULT_THEME -replace '\\', '\\\\' -replace '"', '\"'
          $nodelock = if ($env:SHERBET_INPUT_NODELOCK -eq 'true') { '1' } else { '0' }
          # 테마 id 오타 방지 — 잘못된 id 로 빌드하면 유료 테마가 잠긴 채 배송된다
          $valid_themes = @('mint','peach','pink','rainbow','lavender','noir')
          if ($valid_themes -notcontains $theme) {
            Write-Error "default_theme '$theme' 는 유효한 테마 id 가 아닙니다: $($valid_themes -join ', ')"
            exit 1
          }
          # 개인 전용 프리셋을 붙여넣었으면 내장 파일로 저장(프리셋 마켓에 "내 전용 프리셋" 노출).
          # 웹 UI 입력칸은 줄바꿈을 없애므로 base64 를 우선 시도하고, 실패하면 원문 그대로 사용.
          if (-not [string]::IsNullOrWhiteSpace($env:SHERBET_INPUT_PRESET_INI)) {
            $preset = $env:SHERBET_INPUT_PRESET_INI
            try {
              $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($preset.Trim()))
              if ($decoded -match 'Techniques') { $preset = $decoded }
            } catch {}
            if ($preset -notmatch "(?m)^Techniques") {
              Write-Error "preset_ini 에 줄 시작 'Techniques' 키가 없습니다 — 줄바꿈이 사라졌다면 base64 로 인코딩해 넣어주세요 (예: base64 -i preset.ini)"
              exit 1
            }
            New-Item -ItemType Directory -Force -Path res/presets | Out-Null
            Set-Content -Path res/presets/personal.ini -Value $preset -Encoding UTF8
          }
          $content = @"
          /*
           * Copyright (C) 2026 정렬 (Jeong-Ryeol)
           * SPDX-License-Identifier: BSD-3-Clause
           */

          /*
           * SHERBET — 구매자 개인화 상수.
           * 빌드 시 CI(workflow_dispatch)가 이 파일의 #define 값을 덮어써 주문별 빌드를 만든다.
           * 값이 비어 있으면(기본) 데모 빌드로 취급되어 개인화 문구가 숨겨진다.
           */
          #pragma once

          #ifndef SHERBET_OWNER
          #define SHERBET_OWNER "$owner" // 구매자 닉네임 (UTF-8)
          #endif
          #ifndef SHERBET_ORDER_NO
          #define SHERBET_ORDER_NO "$order" // 주문번호
          #endif
          #ifndef SHERBET_DEFAULT_THEME
          #define SHERBET_DEFAULT_THEME "$theme" // 기본으로 열려 있는 테마 id
          #endif
          #ifndef SHERBET_NODELOCK
          #define SHERBET_NODELOCK $nodelock // 노드락(첫 실행 PC 고정): 1=켬, 0=끔
          #endif

          namespace sherbet
          {
          	inline bool has_owner()
          	{
          		return SHERBET_OWNER[0] != '\0';
          	}
          }
          "@
          Set-Content -Path source/sherbet_owner.h -Value $content -Encoding UTF8

      - name: Build ReShade (32-bit)
        run: |
          msbuild ReShade.sln /p:Configuration=Release /p:Platform=32-bit

      - name: Build ReShade (64-bit)
        run: |
          msbuild ReShade.sln /p:Configuration=Release /p:Platform=64-bit

      - name: Build ReShade Setup
        run: |
          msbuild ReShade.sln /p:Configuration="Release Setup"

      - name: Upload ReShade (32-bit)
        uses: actions/upload-artifact@v7
        with:
          name: Sherbet_Demo (32-bit)
          path: './bin/Win32/Release/ReShade32.dll'

      - name: Upload ReShade (64-bit)
        uses: actions/upload-artifact@v7
        with:
          name: Sherbet_Demo (64-bit)
          path: './bin/x64/Release/ReShade64.dll'

      - name: Upload ReShade Setup
        uses: actions/upload-artifact@v7
        with:
          name: ReShade Setup
          path: './bin/AnyCPU/Release/ReShade Setup.exe'
