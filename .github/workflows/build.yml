name: build

on:
  push:
    branches:
      - main
      - sherbet-base
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      owner:
        description: '구매자 닉네임 (파일 곳곳 각인)'
        required: false
        default: ''
      order_no:
        description: '주문번호'
        required: false
        default: ''
      default_theme:
        description: '기본 테마 (mint/peach/pink/rainbow/lavender/noir/strawberry)'
        required: false
        default: 'mint'
      nodelock:
        description: '노드락(첫 실행 PC 고정) 켜기'
        type: boolean
        required: false
        default: false
      online_auth:
        description: '온라인 인증(디스코드 로그인 게이트) 켜기'
        type: boolean
        required: false
        default: false
      preset_ini:
        description: '개인 전용 프리셋 .ini (base64 인코딩 권장 — 웹 UI 붙여넣기는 줄바꿈이 사라짐. 비우면 프리셋 미포함)'
        required: false
        default: ''

permissions: {}

jobs:
  # 윈도우 빌드와 독립적으로 도는 형제 잡. build 를 needs 로 묶지 않으므로
  # 여기가 빨간불이어도 workflow_dispatch 고객 빌드 아티팩트는 그대로 나온다.
  host-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # sherbet_{content,theme}_json_test 가 deps/imgui 의 헤더를 필요로 한다.
          submodules: true

      - name: 순수 로직 호스트 테스트
        run: |
          set -euo pipefail
          # 주의: -DNDEBUG 를 절대 붙이지 않는다. 이 스위트들은 전부 assert 로
          # 검증하므로 NDEBUG 가 켜지면 단언이 전부 사라져 무조건 통과한다(무의미한 green).
          # 최적화도 켜지 않는다 — -O0 로도 다섯 스위트 합쳐 몇 초면 끝난다.
          # -Ideps/imgui 는 전부에 붙인다(안 쓰는 스위트에는 무해하다).
          for t in sherbet_auth_test sherbet_update_test sherbet_swap_sim \
                   sherbet_content_json_test sherbet_theme_json_test \
                   sherbet_spray_test sherbet_motion_test sherbet_crosshair_test \
                   sherbet_theme_state_test; do
            echo "=== $t ==="
            clang++ -std=c++17 -Wall -Isource -Ideps/imgui "tools/$t.cpp" -o "$RUNNER_TEMP/$t"
            # set -e 가 켜져 있으므로 종료코드 != 0 이면 여기서 잡이 실패한다.
            # 출력 grep 이 아니라 종료코드로 판정한다.
            "$RUNNER_TEMP/$t"
          done

      - name: 순수 로직 호스트 테스트 (ASan + UBSan)
        run: |
          set -euo pipefail
          # ⚠️ 이 패스가 없으면 여러 단언이 **아무것도 검증하지 않는다.**
          # 대표적으로 tools/sherbet_update_test.cpp 의 절단 입력 전수 루프는
          # "진짜 범위 초과 검사는 -fsanitize=address 로 돌릴 때 나온다" 고 스스로 적어 두고
          # 있는데, 평범한 -Wall 빌드에서는 범위를 넘어 읽어도 조용히 지나간다.
          # -fno-sanitize-recover=all 로 첫 위반에서 즉시 죽게 한다(경고만 찍고 통과 금지).
          # 여기서도 -DNDEBUG 금지 — assert 가 사라지면 세니타이저만 남는다.
          for t in sherbet_auth_test sherbet_update_test sherbet_swap_sim \
                   sherbet_content_json_test sherbet_theme_json_test \
                   sherbet_spray_test sherbet_motion_test sherbet_crosshair_test \
                   sherbet_theme_state_test; do
            echo "=== $t (asan+ubsan) ==="
            clang++ -std=c++17 -Wall -Wextra \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -Isource -Ideps/imgui "tools/$t.cpp" -o "$RUNNER_TEMP/${t}_san"
            "$RUNNER_TEMP/${t}_san"
          done

  # 서버 라우터 ↔ 클라 파서 크로스체크를 상설로 돌리는 잡.
  # 이 잡의 존재 이유: 매니페스트 라우터의 계약은 파이썬 쪽 단언만으로는 지켜지지 않는다.
  # `"min_version": ""` 은 파이썬 단언을 전부 통과하면서 클라의 parse_manifest 가
  # 매니페스트를 **통째로 거부**하게 만든다(= 전 고객이 업데이트를 못 받는데 에러는 없다).
  # server/tests/test_update.py 가 라우터의 실제 응답 바디를 진짜 C++ 파서
  # (tools/sherbet_manifest_check.cpp)에 먹여 이 조합을 못 박는다.
  server-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: python -m pip install --disable-pip-version-check -r server/requirements.txt

      - name: pytest
        working-directory: server
        env:
          # 컴파일러가 없으면 크로스체크 테스트가 조용히 skip 되면서 초록불이 된다.
          # 이 잡에서는 skip 을 실패로 바꾼다.
          SHERBET_REQUIRE_CXX: '1'
        run: python -m pytest -q

  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Apply Sherbet owner
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          SHERBET_INPUT_OWNER: ${{ github.event.inputs.owner }}
          SHERBET_INPUT_ORDER_NO: ${{ github.event.inputs.order_no }}
          SHERBET_INPUT_DEFAULT_THEME: ${{ github.event.inputs.default_theme }}
          SHERBET_INPUT_NODELOCK: ${{ github.event.inputs.nodelock }}
          SHERBET_INPUT_ONLINE_AUTH: ${{ github.event.inputs.online_auth }}
          SHERBET_INPUT_PRESET_INI: ${{ github.event.inputs.preset_ini }}
        run: |
          $owner = $env:SHERBET_INPUT_OWNER -replace '\\', '\\\\' -replace '"', '\"'
          $order = $env:SHERBET_INPUT_ORDER_NO -replace '\\', '\\\\' -replace '"', '\"'
          $theme = $env:SHERBET_INPUT_DEFAULT_THEME -replace '\\', '\\\\' -replace '"', '\"'
          $nodelock = if ($env:SHERBET_INPUT_NODELOCK -eq 'true') { '1' } else { '0' }
          $online_auth = if ($env:SHERBET_INPUT_ONLINE_AUTH -eq 'true') { '1' } else { '0' }
          # 테마 id 오타 방지 — 잘못된 id 로 빌드하면 유료 테마가 잠긴 채 배송된다
          $valid_themes = @('mint','peach','pink','rainbow','lavender','noir','strawberry')
          if ($valid_themes -notcontains $theme) {
            Write-Error "default_theme '$theme' 는 유효한 테마 id 가 아닙니다: $($valid_themes -join ', ')"
            exit 1
          }
          # 개인 전용 프리셋을 붙여넣었으면 내장 파일로 저장(프리셋 마켓에 "내 전용 프리셋" 노출).
          # 웹 UI 입력칸은 줄바꿈을 없애므로 base64 를 우선 시도하고, 실패하면 원문 그대로 사용.
          if (-not [string]::IsNullOrWhiteSpace($env:SHERBET_INPUT_PRESET_INI)) {
            $preset = $env:SHERBET_INPUT_PRESET_INI
            try {
              $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($preset.Trim()))
              if ($decoded -match 'Techniques') { $preset = $decoded }
            } catch {}
            if ($preset -notmatch "(?m)^Techniques") {
              Write-Error "preset_ini 에 줄 시작 'Techniques' 키가 없습니다 — 줄바꿈이 사라졌다면 base64 로 인코딩해 넣어주세요 (예: base64 -i preset.ini)"
              exit 1
            }
            New-Item -ItemType Directory -Force -Path res/presets | Out-Null
            Set-Content -Path res/presets/personal.ini -Value $preset -Encoding UTF8
          }
          # 커밋된 sherbet_owner.h 에서 기본값만 치환한다 — 파일을 템플릿으로 재생성하면
          # 헤더에 define 을 추가할 때마다 워크플로도 같이 고쳐야 해서(이중 관리) 빌드가 깨진다.
          $content = Get-Content -Raw source/sherbet_owner.h
          $content = $content -replace '#define SHERBET_OWNER ""', "#define SHERBET_OWNER `"$owner`""
          $content = $content -replace '#define SHERBET_ORDER_NO ""', "#define SHERBET_ORDER_NO `"$order`""
          $content = $content -replace '#define SHERBET_DEFAULT_THEME "mint"', "#define SHERBET_DEFAULT_THEME `"$theme`""
          $content = $content -replace '#define SHERBET_NODELOCK 0', "#define SHERBET_NODELOCK $nodelock"
          $content = $content -replace '#define SHERBET_ONLINE_AUTH 0', "#define SHERBET_ONLINE_AUTH $online_auth"
          Set-Content -Path source/sherbet_owner.h -Value $content -Encoding UTF8 -NoNewline
          # 치환 결과 확인(치환 실패를 조용히 지나치지 않게)
          if ($nodelock -eq '1' -and (Get-Content -Raw source/sherbet_owner.h) -notmatch 'SHERBET_NODELOCK 1') {
            Write-Error "SHERBET_NODELOCK 치환 실패 — sherbet_owner.h 의 기본값 라인이 바뀌었는지 확인하세요"
            exit 1
          }
          if ($online_auth -eq '1' -and (Get-Content -Raw source/sherbet_owner.h) -notmatch 'SHERBET_ONLINE_AUTH 1') {
            Write-Error "SHERBET_ONLINE_AUTH 치환 실패 — sherbet_owner.h 의 기본값 라인이 바뀌었는지 확인하세요"
            exit 1
          }

      - name: Build ReShade (32-bit)
        run: |
          msbuild ReShade.sln /p:Configuration=Release /p:Platform=32-bit

      - name: Build ReShade (64-bit)
        run: |
          msbuild ReShade.sln /p:Configuration=Release /p:Platform=64-bit

      - name: Build ReShade Setup
        run: |
          msbuild ReShade.sln /p:Configuration="Release Setup"

      - name: Upload ReShade (32-bit)
        uses: actions/upload-artifact@v7
        with:
          name: Sherbet_Demo (32-bit)
          path: './bin/Win32/Release/ReShade32.dll'

      - name: Upload ReShade (64-bit)
        uses: actions/upload-artifact@v7
        with:
          name: Sherbet_Demo (64-bit)
          path: './bin/x64/Release/ReShade64.dll'

      - name: Upload ReShade Setup
        uses: actions/upload-artifact@v7
        with:
          name: ReShade Setup
          path: './bin/AnyCPU/Release/ReShade Setup.exe'
